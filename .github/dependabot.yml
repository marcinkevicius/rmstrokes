version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # "deps:" lands in the changelog and triggers a patch release; dev-only bumps don't.
      prefix: deps
      prefix-development: chore
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: a new rmscene can change the .rm bytes we write (docs/format-notes.md).
      - dependency-name: rmscene

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
